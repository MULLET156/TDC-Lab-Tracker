<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TDC LAB TRACKER</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one working column. Sticky header with who's-working + tabs; Cases list grouped by due date; case detail opens as a sheet with the step checklist on top */
:root{
  --bg:#f4f4ef; --surface:#ffffff; --sunk:#ebece4; --line:#d7d9cd;
  --fg:#1f2d33; --muted:#5c6459; --slate:#22343c;
  --accent:#4e5833; --accent-fg:#ffffff; --accent-soft:#e5e9d8;
  --out:#2f557f; --out-soft:#e0e8f2;
  --prog:#2b5fae; --prog-soft:#e0e9f7; --ready:#2d7a3a; --ready-soft:#dcefdf;
  --hold:#8a4b00; --hold-soft:#fbead2; --late:#b3261e; --late-soft:#f9dedb; --new:#767d74; --new-soft:#ebece6;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
  --k0:#0f7c80; --k1:#7a4fb5; --k2:#c2417a; --k3:#b7791f; --k4:#2f6fd0; --k5:#3d8b3d; --k6:#8a5a3b; --k7:#5b6b7a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11191c; --surface:#18242a; --sunk:#1f2e34; --line:#2d3e45;
  --fg:#e5ebe7; --muted:#9aa69f; --slate:#dbe4e4;
  --accent:#9cad72; --accent-fg:#141b10; --accent-soft:#2a3322;
  --out:#8fb4e0; --out-soft:#1c2c40;
  --prog:#93b4ff; --prog-soft:#1d2645; --ready:#7fd08b; --ready-soft:#16301f;
  --hold:#f0a94a; --hold-soft:#3a2a12; --late:#ff8f87; --late-soft:#3d1c19; --new:#9aa39c; --new-soft:#24323a; color-scheme:dark;
  --k0:#4fc3c7; --k1:#b896ef; --k2:#f07bae; --k3:#e8b35a; --k4:#7fa8ff; --k5:#7fcf7f; --k6:#d29a72; --k7:#a3b3c2;
}}
:root[data-theme="dark"]{
  --bg:#11191c; --surface:#18242a; --sunk:#1f2e34; --line:#2d3e45;
  --fg:#e5ebe7; --muted:#9aa69f; --slate:#dbe4e4;
  --accent:#9cad72; --accent-fg:#141b10; --accent-soft:#2a3322;
  --out:#8fb4e0; --out-soft:#1c2c40;
  --prog:#93b4ff; --prog-soft:#1d2645; --ready:#7fd08b; --ready-soft:#16301f;
  --hold:#f0a94a; --hold-soft:#3a2a12; --late:#ff8f87; --late-soft:#3d1c19; --new:#9aa39c; --new-soft:#24323a; color-scheme:dark;
  --k0:#4fc3c7; --k1:#b896ef; --k2:#f07bae; --k3:#e8b35a; --k4:#7fa8ff; --k5:#7fcf7f; --k6:#d29a72; --k7:#a3b3c2;
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--accent)}
@media (max-height:700px){header{position:static}}
header .wrap{padding-block:10px;display:grid;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:grid;gap:0;min-width:0;cursor:pointer}
.brand small{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.logo{display:block;margin-bottom:2px}
.logo img{display:block;height:56px;width:auto;max-width:100%}
.logo .logo-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo .logo-l{display:none}:root:not([data-theme="light"]) .logo .logo-d{display:block}}
:root[data-theme="dark"] .logo .logo-l{display:none}
:root[data-theme="dark"] .logo .logo-d{display:block}
/* phones: logo and name share one line so the sticky header takes less of the screen */
.logo-icon{display:none}
@media (max-width:520px){.brand{display:flex;align-items:center;gap:10px}.logo{margin:0}.logo-full{display:none}.logo-icon{display:block}.logo img{height:42px}.brand b{font-size:19px}header .wrap{gap:8px;padding-top:8px}}
.brand b{font-size:clamp(26px,5vw,32px);font-weight:800;letter-spacing:-.01em;color:var(--slate);line-height:1.05}
/* header right: New case and a Menu button; Setup, who's working, theme, sound and sync sit in the menu */
header .wrap{position:relative}
.topright{display:flex!important;align-items:center;gap:8px;margin-left:auto}
.menubtn{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--slate);border-radius:999px;min-height:44px;padding:0 14px;font-weight:700;font-size:14px}
.menubtn[aria-expanded="true"]{background:var(--slate);color:var(--surface);border-color:var(--slate)}
.mwarn{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:var(--hold);border:2px solid var(--surface)}
.hdrmenu{position:absolute;z-index:30;right:max(16px,env(safe-area-inset-right,0px));top:calc(100% - 8px);display:grid;gap:8px;min-width:250px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.18)}
.hdrmenu .mi{border:1px solid var(--line);background:var(--surface);border-radius:9px;min-height:44px;padding:0 14px;font-weight:700;text-align:left;color:var(--slate)}
.hdrmenu .mi[aria-pressed="true"]{background:var(--slate);color:var(--surface);border-color:var(--slate)}
.hdrmenu .mrow{display:flex;gap:8px;align-items:center}
.hdrmenu .whoami{justify-content:space-between}
@media (max-width:420px){.nc{display:none}}
/* desktop: no Menu button; tools sit in the header like before (theme, sound, Live, who's working on top; All cases, New case, Setup below) */
@media (min-width:641px){
  .menubtn{display:none!important}
  .topright{display:grid!important;grid-template-columns:auto auto;justify-items:end;align-items:center;gap:8px}
  #hdrMenu{display:contents!important}
  .hdrmenu .mrow{grid-row:1;grid-column:1}
  .hdrmenu .whoami{grid-row:1;grid-column:2}
  .topright nav.tabs{grid-row:2;grid-column:1}
  #setupBtn{grid-row:2;grid-column:2;justify-self:start;min-height:36px;border-radius:999px;padding:0 14px;font-size:14px}
  /* laid out like the Maintenance Tracker: logo over title on the left; theme, sound, Live and who's working top right; buttons level with the title */
  header .top{align-items:stretch;flex-wrap:nowrap}
  .topright{align-content:space-between;row-gap:10px;padding-top:8px}
  .topright nav.tabs{align-self:end}
  #setupBtn{align-self:end}
  header nav.tabs button.alltab,header nav.tabs button.newtab{min-height:36px;padding:6px 14px;font-size:14px;border-radius:999px}
  header nav.tabs button.newtab{font-weight:700}
  .title-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
  header .hdr-date{display:inline}
}
.hdr-date{display:none;font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
@media (max-width:520px){header .top{flex-wrap:nowrap}.brand{min-width:0}.brand b{font-size:16px;white-space:normal;line-height:1.1}nav.tabs{gap:6px}nav.tabs button.alltab{padding:10px 12px}.mlabel{display:none}.menubtn{padding:0 11px}nav.tabs button.newtab{padding:10px 14px;font-size:15px}}

.toolbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-weight:700;font-size:14px;color:var(--slate)}
.toolbtn:hover{border-color:var(--accent)}
.toolbtn[aria-pressed="true"]{background:var(--slate);color:var(--surface);border-color:var(--slate)}
.toolbtn.icon{width:36px;padding:0;display:inline-grid;place-items:center}
.toolbtn.icon svg{width:18px;height:18px}
#snd[aria-pressed="true"]{background:var(--surface);color:var(--accent);border-color:var(--accent)}
.sync{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ready);box-shadow:0 0 0 3px var(--ready-soft)}.dot.busy{background:var(--hold)}.dot.err{background:var(--late)}
@media (prefers-reduced-motion:no-preference){.dot.ok{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 5px var(--ready-soft)}}}
.whoami{display:flex;align-items:center;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px}
.whoami label{font-size:12.5px;color:var(--muted);white-space:nowrap}
.whoami select{border:0;background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:6px 10px;font-family:var(--f-mono);font-weight:600}
.whoami.missing{border-color:var(--hold);background:var(--hold-soft)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 14px 11px;font-weight:700;font-size:14.5px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-selected="true"]{color:var(--slate);border-bottom-color:var(--slate)}
nav.tabs .n{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted)}
/* New case is the main action: a filled button rather than a plain tab */
nav.tabs{align-items:center}
nav.tabs{overflow:visible}
nav.tabs button.newtab{margin:0;background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:10px 20px;min-height:44px;font-size:16px;font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.15)}
nav.tabs button.newtab:hover{filter:brightness(1.08)}
nav.tabs{gap:8px}
nav.tabs button.alltab{margin:0;border:1px solid var(--line);background:var(--surface);color:var(--slate);border-radius:10px;padding:10px 16px;min-height:44px;font-size:15px;font-weight:800}
nav.tabs button.alltab:hover{border-color:var(--accent)}
nav.tabs button.alltab[aria-current="page"]{background:var(--slate);color:var(--surface);border-color:var(--slate)}
nav.tabs button.newtab[aria-current="page"]{color:var(--accent-fg);box-shadow:0 0 0 3px var(--accent-soft),0 0 0 4px var(--accent)}
main .wrap{padding-block:16px 80px;display:grid;gap:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn.danger.armed{background:var(--late);color:var(--surface)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.qlink{border:0;background:none;padding:4px 0;color:var(--accent);font-weight:600;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.notice.warn{border-color:var(--hold);background:var(--hold-soft)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;color:var(--muted);text-align:center}
.empty strong{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* summary tiles */
.band{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tile[data-q=all]{--c:var(--slate);--cs:var(--sunk)}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:2px;padding:10px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c,var(--line))}
.tile b{font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--c,var(--fg))}
.tile span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile:hover{border-color:var(--c,var(--accent))}
.tile[aria-pressed="true"]{background:var(--cs,var(--accent-soft));box-shadow:0 0 0 1px var(--c,var(--accent))}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile[data-q=overdue]{--c:var(--late);--cs:var(--late-soft)}
.tile[data-q=today]{--c:var(--hold);--cs:var(--hold-soft)}
.tile[data-q=ready]{--c:var(--ready);--cs:var(--ready-soft)}
.tile[data-q=inhouse]{--c:var(--accent);--cs:var(--accent-soft)}
.tile[data-q=out]{--c:var(--out);--cs:var(--out-soft)}
@media (max-width:640px){.band{grid-template-columns:repeat(3,minmax(0,1fr))}.tile b{font-size:24px}.tile span{font-size:10.5px;letter-spacing:.03em}}
/* in the sticky header: compact, and one swipeable row on phones so the header stays short */
header .tile{padding:6px 10px;border-top-width:3px}
header .tile b{font-size:20px}
@media (max-width:640px){header .band{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}header .tile{padding:5px 6px}header .tile b{font-size:18px}header .tile span{font-size:10px;letter-spacing:.02em}}
.tile[data-q="911"]{--c:var(--late);--cs:var(--late-soft)}
.tile[data-q=hold]{--c:var(--hold);--cs:var(--hold-soft)}
.tile[data-q=active]{--c:var(--accent);--cs:var(--accent-soft)}
/* 911 badge on the Overdue tile, same as the Supply Room's */
.tile{position:relative}
.tbadges{position:absolute;top:-8px;right:-6px;display:flex;gap:3px;flex-wrap:nowrap}
.tbadges i{white-space:nowrap}
@media (max-width:640px){.tbadges{right:-4px;gap:2px}.tbadges i{font-size:10.5px;padding:0 5px}}
.bdate{background:#8a4b00;color:#fff;border:2px solid var(--surface);border-radius:999px;font-size:11.5px;font-weight:800;font-style:normal;padding:1px 7px;line-height:1.3}
.b911{background:#c0302a;color:#fff;border:2px solid var(--surface);border-radius:999px;font-size:11.5px;font-weight:800;font-style:normal;padding:1px 7px;line-height:1.3;letter-spacing:0}

.filters{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:42px;min-width:0}
.filters select{max-width:180px}
@media (max-width:640px){.filters{grid-template-columns:1fr 1fr 1fr}.filters input{grid-column:1/-1}.filters select{max-width:none}}

/* case list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grp{padding:9px 14px 7px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--slate);background:var(--sunk);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.grp:first-child{border-top:0}
.grp.late{color:var(--late);background:var(--late-soft)}
.grp span{font-family:var(--f-mono);letter-spacing:0;font-weight:600}
.crow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:6px minmax(0,1fr) auto;width:100%;border-top:1px solid var(--line)}
.grp+.crow{border-top:0}
.crow:hover{background:var(--sunk)}
.crow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.strip{background:var(--c)}
[data-s=new]{--c:var(--new);--cs:var(--new-soft)}
[data-s=inprog]{--c:var(--prog);--cs:var(--prog-soft)}
[data-s=ready]{--c:var(--ready);--cs:var(--ready-soft)}
[data-s=hold]{--c:var(--hold);--cs:var(--hold-soft)}
[data-s=delivered],[data-s=cancelled]{--c:var(--line);--cs:var(--sunk)}
.cmain{padding:11px 12px 11px 14px;min-width:0;display:grid;gap:4px}
.pt{font-weight:700;font-size:15.5px;overflow-wrap:anywhere}
.pt small{font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.restorerow{align-items:center}
.f.chkrow{display:flex;flex-direction:row;flex-wrap:wrap;gap:6px 22px;align-items:center;align-self:end;min-height:42px}
.cmeta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--fg)}
.pill.type{background:var(--accent-soft);color:var(--fg)}
.pill.in{background:var(--accent);color:var(--accent-fg)}
.pill.out{background:var(--out-soft);color:var(--out)}
.pill.rush{background:var(--late);color:var(--surface)}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.st{background:var(--cs);color:var(--c)}
[data-s=delivered] .pill.st,[data-s=cancelled] .pill.st{color:var(--muted)}
.teeth{font-family:var(--f-mono);font-weight:600;font-size:12.5px;color:var(--fg)}
.next{font-size:13px;color:var(--fg)}
.next b{font-weight:600}
.lastby{color:var(--muted);font-size:12.5px}
.lastby .init,.by .init{font-size:11px;padding:0 5px}
.cside{padding:11px 14px 11px 4px;display:grid;justify-items:end;align-content:center;gap:5px;min-width:96px}
.due{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.due.late{color:var(--late);font-weight:600}
.prog{width:84px;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--c)}
.pc{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
@media (max-width:480px){.cside{min-width:78px}.prog{width:64px}}

/* forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.card h3{margin:0;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
.f{display:grid;gap:4px;min-width:0;align-content:start}
.f > label,.f > .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.f textarea{resize:vertical}
.f input.mono{font-family:var(--f-mono)}
.chkl{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14.5px;cursor:pointer;padding-top:22px}
/* drawn by hand: the general field style (gray fill, padding) was bleeding into the native checkbox */
.f .chkl input{appearance:none;-webkit-appearance:none;width:22px;height:22px;min-width:0;padding:0;margin:0;flex:none;border:2px solid var(--muted);border-radius:6px;background:var(--surface);display:inline-grid;place-items:center;cursor:pointer}
.f .chkl input:checked{background:var(--late);border-color:var(--late)}
.f .chkl input:checked::before{content:"";width:11px;height:6px;border:solid var(--surface);border-width:0 0 3px 3px;transform:translateY(-2px) rotate(-45deg)}
@media (max-width:520px){.fields{grid-template-columns:1fr}.chkl{padding-top:0}.f.chkrow{min-height:0}}
.pagehead{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between}
.pagehead h2{margin:0;font-size:22px;font-weight:800;color:var(--slate);text-wrap:balance}

.typepick{display:grid;gap:10px}
.tgrp{display:grid;gap:6px}

  const open=S.cases.filter(isOpen),t=todayISO(),onCases=S.tab==="cases";

/* ---------- cases tab ---------- */
function filtered(){
  const q=S.q.trim().toLowerCase(),t=todayISO();
  return S.cases.filter(c=>{
    const st=stage(c);
    if(S.fState==="open"&&!isOpen(c))return false;
    if(S.fState==="delivered"&&c.state!=="delivered")return false;
    if(S.fState==="cancelled"&&c.state!=="cancelled")return false;
    if(S.fWhere==="inhouse"&&!isIn(c))return false;
    if(S.fWhere==="out"&&isIn(c))return false;
    if(S.fWhere.startsWith("lab:")&&c.lab!==S.fWhere.slice(4))return false;
    if(S.fType&&c.type!==S.fType)return false;
    if(S.fQuick==="overdue"&&!(isLate(c)||is911(c)))return false;
    if(S.fQuick==="911"&&!is911(c))return false;
    if(S.fQuick==="active"&&!isActive(c))return false;
    if(S.fQuick==="hold"&&c.state!=="hold")return false;
    if(S.fQuick==="today"&&!(isOpen(c)&&c.due===t))return false;
    if(S.fQuick==="ready"&&!isReady(c))return false;
    if(S.fQuick==="inhouse"&&!(isOpen(c)&&isIn(c)))return false;
    if(S.fQuick==="out"&&!(isOpen(c)&&!isIn(c)))return false;
    if(q){const hay=[c.remake?"remake "+(c.remakeReason||""):"",c.patient,c.chart,c.dob,fmtDOB(c.dob),c.createdBy,...(c.steps||[]).map(s=>s.by),typeName(c),labName(c.lab),teethLabel(c.teeth),(c.teeth||[]).map(n=>"#"+n).join(" "),c.doctor,c.notes,c.labNo,c.tracking,...(c.comms||[]).map(x=>x.text),...Object.values(c.fields||{})].join(" ").toLowerCase();if(!hay.includes(q))return false}
    return true;
  });
}

/* ---------- new case ---------- */
function freshDraft(){return {patient:"",chart:"",dob:"",type:"",lab:"inhouse",teeth:[],fields:{},due:"",seat:"",doctor:"",rush:false,remake:false,remakeReason:"",notes:"",labNo:"",tracking:"",fee:"",sentAt:"",dueAuto:true}}

let savingDraft=false;
const DATE_ORDER="The ready / due-back date has to be on or before the delivery appointment.";
async function saveDraft(){
  const d=S.draft;if(savingDraft)return;
  if(!d.patient.trim()&&!d.chart.trim()){toast("Add the patient # or name first.");$("#new-ch")?.focus();return}
  d.patient=shortName(d.patient);d.chart=d.chart.trim();

  const me=getMe();
  if(!me){toast("Pick your initials at the top first so the case shows who created it.");(openMenu(true),$("#who")?.focus());return}

  const want=(typeOf(d.type)||{}).fields||[],fields=Object.fromEntries(Object.entries(d.fields||{}).filter(([k,v])=>want.includes(k)&&String(v).trim()));
  delete d.dueAuto;
  const c={...d,fields,patient:d.patient.trim(),steps:buildSteps(d.type,d.lab),state:"open",createdAt:Date.now(),createdBy:me,updatedAt:Date.now(),updatedBy:me,log:[{at:Date.now(),by:me||"?",what:"Case created"}]};
  savingDraft=true;const sb=document.querySelector("#newform [type=submit]");if(sb){sb.disabled=true;sb.textContent="Saving…"}

/* ---------- case sheet ---------- */
/* the seat appointment sits at the top of the case sheet, with the 911 / timing warnings */
function seatBar(c){
  if(!isOpen(c))return"";
  const due=c.due?`<span class="hint">${!isIn(c)?"Due back":"Ready by"} ${esc(fmtD(c.due))}</span>`:"";
  if(!c.seat)return `<div class="seatbar"><span class="hint">Delivery appointment</span><b>Not set</b>${due}<span class="hint">Add it under Case details.</span></div>`;
  const cls=is911(c)?" e911":seatPassed(c)||isTight(c)||isLate(c)?" warn":"";
  const note=is911(c)?'<span class="pill p911">🚨 911</span><span class="hint">Not finished, and the patient is in '+esc(relDay(c.seat))+'.</span>'
    :seatPassed(c)?'<span class="pill nnd">Needs new delivery date</span><span class="hint">The '+esc(fmtD(c.seat))+' appointment passed without delivery.'+(c.state==="hold"?"":" Goes on hold "+esc(fmtD(holdOn(c)))+" if no new date is set.")+'</span><label class="nndpick"><span class="hint">New date</span><input type="date" data-newseat min="'+esc(todayISO())+'"></label>'
    :isTight(c)?'<span class="pill tight">Tight: due back a day or less before the delivery appointment</span>':"";
  return `<div class="seatbar${cls}"><span class="hint">Delivery appointment</span><b>${esc(fmtD(c.seat))}</b><span class="hint">${esc(relDay(c.seat))}</span>${due}${note}</div>`;
}
/* the lab slip as a real PDF (US Letter), written directly so it needs nothing from outside the page */
function slipRows(c){const t=typeOf(c.type),fv=c.fields||{},fl=F();
  return [["Patient",(c.patient||"")+(c.chart?"   #"+c.chart:"")],["Date of birth",fmtDOB(c.dob)],["Case type",typeName(c)],["Teeth",teethLabel(c.teeth)],["Made by",labName(c.lab)],
    ...((t&&t.fields)||[]).filter(k=>fl[k]&&fv[k]).map(k=>[fl[k].label,fv[k]]),
    [!isIn(c)?"Due back":"Ready by",c.due?fmtD(c.due):""],["Delivery appointment",c.seat?fmtD(c.seat):""],["Doctor",c.doctor],["Lab's case #",c.labNo],["Tracking #",c.tracking],
    ["Rush",c.rush?"YES":""],["Remake",c.remake?"Yes"+(c.remakeReason?" ("+c.remakeReason+")":""):""],["Notes",c.notes]].filter(r=>r[1])}
function slipPDF(c){

  const pe=v=>String(v??"").replace(/[–—]/g,"-").replace(/[·•]/g,"-").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/→/g,"->").replace(/[^\x20-\x7e]/g,"?").replace(/([()\\])/g,"\\$1");
  const txt=(x,yy,v,sz,b)=>ops.push(`BT /${b?"F2":"F1"} ${sz} Tf ${x} ${yy.toFixed(1)} Td (${pe(v)}) Tj ET`);

  const box=(x,yy,w,h)=>ops.push(`${x} ${yy.toFixed(1)} ${w} ${h} re S`);
  const wrap=(v,sz,w)=>{const cap=Math.max(8,Math.floor(w/(sz*.52))),out=[];for(const para of String(v??"").split(/\n/)){let cur="";for(const word of para.split(/\s+/)){if(!word)continue;if(cur&&(cur+" "+word).length>cap){out.push(cur);cur=word}else cur=cur?cur+" "+word:word;while(cur.length>cap){out.push(cur.slice(0,cap));cur=cur.slice(cap)}}out.push(cur)}return out.length?out:[""]};
  const room=h=>{if(y-h<M){pages.push(ops);ops=[];y=H-M}};
  txt(M,y-14,"Toledo Dental Care - Lab slip",18,true);y-=22;
  txt(M,y-10,"Printed "+new Date().toLocaleString()+(c.createdBy?"   Created by "+c.createdBy:""),9);y-=24;
  ops.push("0.5 w");const LW=150,TW=W-2*M;
  for(const [k,v] of slipRows(c)){const lines=wrap(v,11,TW-LW-12),h=Math.max(1,lines.length)*14+8;room(h);
    box(M,y-h,TW,h);ln(M+LW,y,M+LW,y-h);txt(M+6,y-15,k,11,true);lines.forEach((l,i)=>txt(M+LW+6,y-15-i*14,l,11,k==="Rush"));y-=h}
  y-=18;room(20);txt(M,y-12,"Steps",13,true);y-=22;

  return out;
}

function parseCSV(t){
  t=t.replace(/^﻿/,"");const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;else if(ch===","){row.push(cell);cell=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}
    else cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim())).map(r=>r.map(c=>c.trim().replace(/^'(?=[=+\-@])/,"")));
}

    const newLabs=new Map(),cases=[];

    for(const r of rows.slice(1)){

      const ln=g(ix.lab).trim();let lab="inhouse";
      if(ln&&!/^in[- ]?house$/i.test(ln)){const ex=S.labs.find(l=>l.name.toLowerCase()===ln.toLowerCase());if(ex)lab=ex.id;else{if(!newLabs.has(ln.toLowerCase()))newLabs.set(ln.toLowerCase(),{id:"lab"+rid(),name:ln});lab=newLabs.get(ln.toLowerCase()).id}}
      const stx=g(ix.status).toLowerCase(),state=/deliver/.test(stx)?"delivered":/cancel/.test(stx)?"cancelled":/hold/.test(stx)?"hold":"open";
      const steps=buildSteps(t.id,lab);const m=/^(\d+)\s*\/\s*\d+/.exec(g(ix.done));const nd=/ready/.test(stx)||state==="delivered"?steps.length:m?+m[1]:0;
      steps.forEach((s,i)=>{if(i<nd){s.done=true;s.by="import";s.at=Date.now()}});
      const fields={};for(const k in fIx){const v=g(fIx[k]);if(v)fields[k]=v}
      cases.push({patient:shortName(g(ix.patient)),chart:g(ix.chart),dob:dt(g(ix.dob)),type:t.id,lab,teeth:parseTeeth(g(ix.teeth)),fields,due:dt(g(ix.due)),seat:dt(g(ix.seat)),doctor:g(ix.doctor),rush:/^(y|yes|true|1|x)$/i.test(g(ix.rush)),labNo:g(ix.labNo),tracking:g(ix.tracking),fee:g(ix.fee),sentAt:dt(g(ix.sentAt)),notes:g(ix.notes),steps,state,deliveredAt:state==="delivered"?todayISO():"",createdAt:Date.now(),createdBy:getMe(),updatedAt:Date.now(),log:[{at:Date.now(),by:getMe()||"?",what:"Imported from "+name}]});
    }

  }

async function runImport(){
  const p=S.imp;if(!p||!needDb())return;
  const b=document.querySelector("[data-impgo]");let done=0,fail=0;
  const step=()=>{if(b){b.disabled=true;b.textContent=`Importing… ${done+fail}`}};
  if(p.running)return;p.running=true;step();
  if(p.kind==="json"){
    if(Array.isArray(p.d.team)){try{await S.db.doc("settings/team").set({initials:p.d.team.map(x=>String(x).toUpperCase().slice(0,4)).filter(Boolean)})}catch(e){fail++}}
    if(p.d.types&&Array.isArray(p.d.types.types)){try{await S.db.doc("settings/types").set({types:p.d.types.types,outSteps:p.d.types.outSteps||DEFAULT_OUT,fieldDefs:p.d.types.fieldDefs||{}})}catch(e){fail++}}
    if(p.d.lists&&Array.isArray(p.d.lists.matCats)){try{await S.db.doc("settings/lists").set({shades:Array.isArray(p.d.lists.shades)?p.d.lists.shades:SHADES,matCats:p.d.lists.matCats})}catch(e){fail++}}
    if(p.d.colors&&typeof p.d.colors==="object"){try{await S.db.doc("settings/colors").set({map:p.d.colors})}catch(e){fail++}}
    for(const l of p.labs){const{id,...rest}=l;try{await S.db.doc("labs/"+id).set(rest);done++}catch(e){fail++}step()}
    for(const c of p.cases){const{id,...rest}=c;try{await S.db.doc("cases/"+id).set(rest);done++}catch(e){fail++}step()}
  }else{
    for(const l of p.newLabs){const{id,...rest}=l;try{await S.db.doc("labs/"+id).set({...rest,createdAt:Date.now()});done++}catch(e){fail++}step()}
    for(const c of p.cases){try{await S.db.collection("cases").add(c);done++}catch(e){fail++}step()}
  }
  S.imp=null;render(true);
  toast(fail?`Imported ${done}; ${fail} couldn't be saved. Try the file again.`:`Imported ${done} record${done===1?"":"s"}.`);
}

function toggleTeeth(cur,n,arch){
  let t=new Set((cur||[]).map(Number));
  if(arch==="C")t=new Set();
  else if(arch){const r=arch==="U"?[1,16]:[17,32];const all=[];for(let i=r[0];i<=r[1];i++)all.push(i);const has=all.every(i=>t.has(i));all.forEach(i=>has?t.delete(i):t.add(i))}
  else t.has(n)?t.delete(n):t.add(n);
  return [...t].sort((a,b)=>a-b);
}

    mc.items.push(v);if(await saveLists(l))toast(`Added ${v} to ${mc.name}`);document.querySelector(`[data-mc="${CSS.escape(id)}"] [data-addmat] input`)?.focus();return}
  if(f.id==="addmc"){const inp=$("#newmc"),v=inp.value.trim(),l=listsNow();if(!v)return;if(l.matCats.some(c=>c.name.toLowerCase()===v.toLowerCase())){toast(v+" already exists.");return}
    l.matCats.push({id:"m"+rid(),name:v,items:[]});inp.value="";if(await saveLists(l))toast("Added "+v+". Tick it for the case types that use it.");return}
  if(f.id==="addteam"){const inp=$("#newinit"),v=inp.value.trim().toUpperCase();if(!v)return;if(S.team.includes(v)){toast(v+" is already on the team.");return}inp.value="";if(await setDoc("settings/team",{initials:[...S.team,v]})){toast("Added "+v);if(!getMe()){setMe(v)}renderHead()}return}
  if(f.id==="addlab"){const inp=$("#newlab"),v=inp.value.trim();if(!v||!needDb())return;if(S.labs.some(l=>l.name.toLowerCase()===v.toLowerCase())){toast(v+" is already on the list.");return}inp.value="";try{await S.db.collection("labs").add({name:v,contact:"",phone:"",email:"",website:"",account:"",portal:"",password:"",turnaround:"",address:"",notes:"",createdAt:Date.now()}).then(r=>{S.openL.add(r.id);return r});toast("Added "+v)}catch(e){inp.value=v;writeFail(e)}return}
});
/* drag to reorder: steps and details in Setup, and steps on a case while editing */
const mvIds=(a,from,to)=>{a=[...a];const [x]=a.splice(from,1);a.splice(to,0,x);return a};
function commitMove(list,from,to){
  const kind=list.dataset.dlist,mv=a=>{const [x]=a.splice(from,1);a.splice(to,0,x);return a};
  if(kind==="c"){const c=caseOf(S.panel);if(!c)return render(true);const st=[...c.steps],s=st[from];patchCase(c,{steps:mv(st)},"Moved step: "+s.l);return}
  /* case types: save the order shown (on types first, then off) */
  if(kind==="o"){if(!S.optShown)return render(true);saveLists({...listsNow(),optOrder:mvIds(S.optShown,from,to)});return}
  if(kind==="t"){const shown=[...TYPES().filter(t=>!t.off),...TYPES().filter(t=>t.off)].map(t=>t.id);const ord=mvIds(shown,from,to);
    const by=new Map(TYPES().map(t=>[t.id,t]));const next=ord.map(id=>by.get(id)).filter(Boolean);
    const on=next.filter(t=>!t.off),off=next.filter(t=>t.off);saveTypes([...on,...off]);return}
  const tid=list.closest("[data-tid]")?.dataset.tid;if(!tid)return render(true);
  if(kind==="s"){if(tid==="__out")saveTypes(null,mv([...OUTSTEPS()]));else mutType(tid,t=>{t.steps=mv(t.steps)});return}
  if(kind==="f"){const fl=F();mutType(tid,t=>{t.fields=mv(t.fields.filter(k=>fl[k]))})}
}
let drag=null,downOnScrim=false;
const rowsOf=list=>[...list.children].filter(r=>r.matches(".erow,.stp,.trow"));
document.addEventListener("pointerdown",ev=>{
  /* a text selection that starts in the sheet and ends on the backdrop shouldn't close it */
  downOnScrim=!!(ev.target.matches&&ev.target.matches("[data-scrim]"));
  const g=ev.target.closest("[data-grip]");if(!g||ev.button>0)return;
  const list=g.closest("[data-dlist]"),row=g.closest(".erow,.stp,.trow");if(!list||!row)return;
  ev.preventDefault();
  drag={list,row,from:rowsOf(list).indexOf(row),id:ev.pointerId};S.dragging=true;
  row.classList.add("dragging");document.body.classList.add("is-dragging");
  try{g.setPointerCapture(ev.pointerId)}catch(e){}
});
document.addEventListener("pointermove",ev=>{
  if(!drag||ev.pointerId!==drag.id)return;ev.preventDefault();
  /* scroll when the row is dragged near the top or bottom edge, so long lists can be reordered on a phone */
  const sc=drag.list.closest(".panel"),top=sc?sc.getBoundingClientRect().top:0,bot=sc?sc.getBoundingClientRect().bottom:window.innerHeight;
  if(ev.clientY<top+60)(sc||window).scrollBy(0,-14);else if(ev.clientY>bot-60)(sc||window).scrollBy(0,14);
  let before=null;
  for(const r of rowsOf(drag.list)){if(r===drag.row)continue;const b=r.getBoundingClientRect();if(ev.clientY<b.top+b.height/2){before=r;break}}
  if(before!==drag.row.nextElementSibling)drag.list.insertBefore(drag.row,before||rowsOf(drag.list).pop().nextSibling);
});
function endDrag(ev){
  if(!drag||ev.pointerId!==drag.id)return;
  const d=drag;drag=null;S.dragging=false;
  d.row.classList.remove("dragging");document.body.classList.remove("is-dragging");
  const to=rowsOf(d.list).indexOf(d.row);
  if(ev.type==="pointerup"&&to!==d.from&&to>=0)commitMove(d.list,d.from,to);else render(true);
}
document.addEventListener("pointerup",endDrag);
document.addEventListener("pointercancel",endDrag);
document.addEventListener("keydown",ev=>{
  const g=ev.target.closest&&ev.target.closest("[data-grip]");
  if(g&&(ev.key==="ArrowUp"||ev.key==="ArrowDown")){
    const list=g.closest("[data-dlist]");if(!list)return;ev.preventDefault();
    const n=rowsOf(list).length,from=+g.dataset.grip,to=from+(ev.key==="ArrowUp"?-1:1);
    if(to<0||to>=n)return;
    /* every case type's list is on the page, so find the same list again by its type before refocusing */
    const tl=list.dataset.dlist==="t"||list.dataset.dlist==="o",tid=tl?"":list.closest("[data-tid]")?.dataset.tid,scope=tl?"#view":tid?`.tline[data-tid="${CSS.escape(tid)}"],.card[data-tid="${CSS.escape(tid)}"]`:"#panelRoot";
    commitMove(list,from,to);
    setTimeout(()=>{const ng=document.querySelector(`:is(${scope}) [data-dlist="${list.dataset.dlist}"] [data-grip="${to}"]`);ng&&ng.focus()},50);return;
  }
  if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches&&ev.target.matches("[data-home]")){ev.preventDefault();ev.target.click();return}
  if(ev.key==="Escape"&&!$("#hdrMenu").hidden){openMenu(false);$("#menuBtn").focus();return}
  if(ev.key==="Escape"&&S.panel){S.panel=null;render()}
});

/* ---------- theme: follows the device until someone picks, then this device remembers ---------- */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function pickedTheme(){try{return localStorage.getItem("tdc-theme")||""}catch(e){return""}}
function curTheme(){const a=document.documentElement.getAttribute("data-theme");return a==="dark"||a==="light"?a:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}
function applyTheme(){
  const p=pickedTheme(),root=document.documentElement;
  if(p&&root.getAttribute("data-theme")!==p)root.setAttribute("data-theme",p);
  const dark=curTheme()==="dark",b=$("#themeBtn"),l=dark?"Switch to light theme":"Switch to dark theme";
  b.innerHTML=dark?SUN:MOON;b.setAttribute("aria-label",l);b.title=l;
}
/* ---------- sound: same chimes as the Maintenance Tracker when a step is checked off; a fanfare when the case is finished ---------- */
let AC=null,lastS=-1;
function soundOn(){try{return localStorage.getItem("tdc-sound")!=="off"}catch(e){return true}}
function primeAudio(){if(!soundOn())return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){AC=null}}
function tone(f,t0,dur,type,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.18,t0+.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+.05)}
const SOUNDS=[
  t=>[523.25,659.25,783.99].forEach((f,i)=>tone(f,t+i*.09,.35)),
  t=>{tone(1318.5,t,.9,"sine",.15);tone(2637,t,.6,"sine",.05)},
  t=>{tone(880,t,.12,"triangle");tone(1174.66,t+.11,.2,"triangle")},
  t=>[1567.98,2093,2637,3135.96].forEach((f,i)=>tone(f,t+i*.05,.25,"sine",.08)),
  t=>{tone(392,t,.12,"square",.05);tone(392,t+.13,.12,"square",.05);tone(523.25,t+.26,.45,"square",.06)},
  t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(400,t);o.frequency.exponentialRampToValueAtTime(1200,t+.18);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.35)}
];
function playDone(){if(!soundOn()||!AC)return;try{let i;do{i=Math.floor(Math.random()*SOUNDS.length)}while(i===lastS);lastS=i;SOUNDS[i](AC.currentTime+.02)}catch(e){}}
/* celebration: a rising fanfare into a held major chord, with a sparkle on top */
function playCelebrate(){if(!soundOn()||!AC)return;try{const t=AC.currentTime+.03;
  [392,523.25,659.25].forEach((f,i)=>tone(f,t+i*.11,.18,"triangle",.16));
  tone(783.99,t+.33,.14,"triangle",.16);tone(659.25,t+.47,.12,"triangle",.14);
  [523.25,659.25,783.99,1046.5].forEach(f=>tone(f,t+.6,1.3,"triangle",.09));
  tone(261.63,t+.6,1.3,"sine",.1);
  [2093,2637,3135.96,4186,3135.96,4186].forEach((f,i)=>tone(f,t+.62+i*.07,.3,"sine",.045));
}catch(e){}}
const ICON_ON='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6h2.5l3-2.5v9L5 10H2.5z"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6.5 6.5 0 0 1 0 9"/></svg>';
const ICON_OFF='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6h2.5l3-2.5v9L5 10H2.5z"/><path d="M10.5 6l4 4M14.5 6l-4 4"/></svg>';
function renderSnd(){const on=soundOn(),b=$("#snd");if(!b)return;const l=on?"Sound on (tap to mute)":"Sound off (tap to turn on)";b.setAttribute("aria-label",l);b.title=l;b.setAttribute("aria-pressed",String(on));b.innerHTML=on?ICON_ON:ICON_OFF}
renderSnd();
applyTheme();
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",applyTheme);

/* ---------- boot ---------- */
render(true);
(async()=>{
  const cl=window.claude;if(!cl||!cl.use){S.live=true;sync("err","Offline");render(true);return}
  const [db,user,dl]=await Promise.all([cl.use("db"),cl.use("user"),cl.use("downloads")]);
  S.db=db;S.dl=dl;S.live=true;
  if(user){try{const w=await user.can("data.write");if(w===false)S.canWrite=false}catch(e){}}
  if(!db){sync("err","Offline");render(true);return}
  const byName=(a,b)=>(a.name||"").localeCompare(b.name||"");
  /* every open or on-hold case, however old, plus the 500 newest of any status (for the Delivered / Cancelled views) */
  const fix=d=>{const c={id:d.id,...d.data()};if(!c.lab)c.lab="inhouse";if(!Array.isArray(c.steps))c.steps=[];return c};
  let openSet=[],recentSet=[],gotO=false,gotR=false;
  const merge=()=>{const m=new Map();for(const c of [...recentSet,...openSet]){const e=m.get(c.id);if(!e||(c.updatedAt||0)>=(e.updatedAt||0))m.set(c.id,c)}
    S.cases=[...m.values()].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));if(gotO&&gotR){S.loaded.c=true;if(!pending)idle();autoHold()}snapRender()};
  const lost=()=>{gotO=gotR=true;S.loaded.c=true;sync("err","Connection lost");render()};
  db.collection("cases").where("state","in",["open","hold"]).onSnapshot(s=>{openSet=s.docs.map(fix);gotO=true;merge()},lost);
  /* newest cases of any status; "Load older cases" raises the limit */
  let unR=null;S.recentLimit=500;
  S.subRecent=()=>{try{unR&&unR()}catch(e){}const u=db.collection("cases").orderBy("createdAt","desc").limit(S.recentLimit).onSnapshot(s=>{recentSet=s.docs.map(fix);S.moreOld=recentSet.length>=S.recentLimit;gotR=true;merge()},lost);unR=typeof u==="function"?u:null};
  S.subRecent();
  db.collection("labs").onSnapshot(s=>{S.labs=s.docs.map(d=>({id:d.id,...d.data()})).sort(byName);S.loaded.l=true;snapRender()},()=>{S.loaded.l=true;render()});
  db.doc("settings/team").onSnapshot(s=>{S.team=(s.exists&&s.data().initials)||[];S.loaded.s=true;snapRender()},()=>{});
  db.doc("settings/lists").onSnapshot(s=>{S.lists=s.exists?s.data():null;snapRender()},()=>{});
  db.doc("settings/colors").onSnapshot(s=>{S.colors=(s.exists&&s.data().map)||{};applyCustomK();snapRender()},()=>{});
  db.doc("settings/types").onSnapshot(s=>{S.typesDoc=s.exists?s.data():null;S.loaded.t=true;snapRender()},()=>{});
})();
setInterval(()=>{if(!busy($("#view"))&&!busy($("#panelRoot")))render()},60000);
})();
</script>
